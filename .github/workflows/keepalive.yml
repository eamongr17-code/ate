name: Staging keep-alive

# Schedules only fire from main, but the real job lives on the integration branch
# (claude/project-thread-2f9ty8). This copy on main only forwards: once a day it dispatches
# keepalive.yml on that branch, so main never needs updating for it again.
# Do not merge this file into the integration branch: there, keepalive.yml is the real job.

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  actions: write

env:
  BRANCH: claude/project-thread-2f9ty8

jobs:
  forward:
    name: Run the integration branch's keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch keepalive.yml on the integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run keepalive.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Dispatched keepalive.yml on $BRANCH."
