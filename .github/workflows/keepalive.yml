name: Staging keep-alive

# Supabase pauses free projects after about a week without traffic, which takes the TestFlight app
# down (it happened in September 2026). One real query a day keeps staging awake. This never touches prod.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping staging
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: One anonymous read through PostgREST
        run: |
          # The publishable key + RLS deny-by-default means this returns 200 and [] — but it is a real
          # database query, which is what counts as activity.
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
            "${{ vars.SUPABASE_URL_STAGING }}/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_KEY_STAGING }}")
          echo "status=$code body=$(cat /tmp/body)"
          [ "$code" = "200" ]

      # Boots the sorter's isolate through its no-op health path ({"health": true}: no auth, no read,
      # no model call, no write). A daily ping cannot keep it warm — isolates are reclaimed after minutes
      # idle — so this proves the function still boots; the app's own warm-up (a health call when the
      # composer opens) is what removes the cold start from Done. Never fails the keep-alive: the DB
      # read above is the one that keeps staging awake. Staging only.
      - name: Sorter health (sort-entry, no model call)
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/fn -w '%{http_code}' --max-time 30 -X POST \
            "${{ vars.SUPABASE_URL_STAGING }}/functions/v1/sort-entry" \
            -H "apikey: ${{ vars.SUPABASE_KEY_STAGING }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_KEY_STAGING }}" \
            -H "Content-Type: application/json" \
            -d '{"health": true}')
          echo "status=$code body=$(cat /tmp/fn)"
          [ "$code" = "200" ]
