# SwiftLint — the definition-of-done gate AGENTS.md names (rule 3).
# Philosophy: catch real defects and drift, don't fight SwiftUI idiom.

included:
  - App
  - AteKit/Sources
  - AteKit/Tests

excluded:
  - AteKit/.build
  - .build
  - DerivedData

line_length:
  warning: 120
  error: 140
  ignores_urls: true
  ignores_comments: false

# SwiftUI bodies and test suites legitimately run long.
type_body_length:
  warning: 350
  error: 500
function_body_length:
  warning: 80
  error: 120
file_length:
  warning: 500
  error: 700

identifier_name:
  min_length: 2 # x/y in gesture math, id, db
  max_length: 50
  excluded: [l, r, a, b] # comparator/test-pair idiom

nesting:
  type_level: 2 # Theme.Color.*, enum namespacing is the house style

disabled_rules:
  - todo # TODOs are tracked in PRs, not lint
  - trailing_comma # SwiftFormat territory; not worth churn

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument

custom_rules:
  # Lucide is the one icon set (round 5): every icon is an `AteIcon` case, never an SF Symbol.
  no_sf_symbols:
    name: "No SF Symbols"
    included: "/App/.*\\.swift$"
    regex: '(Image|UIImage|Label)\s*\([^)]*\b(systemName|systemImage)\s*:'
    message: "Icons come from Lucide via AteIcon; add a case rather than using an SF Symbol."
    severity: error
  # Every launch argument is declared in AteKit's `DebugLaunch.swift` and read through it: a drive
  # opens a screen with `-ate-open <route>`, never with a new one-off flag in the view that reads it.
  launch_arguments_in_one_place:
    name: "Launch arguments live in DebugLaunch"
    included: "/(App|AteKit/Sources)/.*\\.swift$"
    excluded: "/DebugLaunch\\.swift$"
    regex: '-ate-[a-z]'
    match_kinds: [string]
    message: "Declare launch arguments in AteKit/Sources/AteKit/Debug/DebugLaunch.swift and read them through DebugLaunch."
    severity: error
  # The component kit is the only place look-and-feel is decided, and it decides it through the
  # tokens (`App/DesignSystem/Tokens/`): no colour, font, radius or shadow literal in a kit
  # component. Scoped to the kit for now — the old screens still carry literals and are not restyled
  # to satisfy it; each rebuilt flow's folder joins the scope as it lands, and the legacy screens
  # leave it when they are deleted.
  kit_no_colour_literal:
    name: "No colour literal in the kit"
    included: "/App/DesignSystem/Kit/.*\\.swift$"
    regex: '(\bColor\s*\(\s*(hex|red|white|light|\.sRGB|uiColor|\.displayP3)\b|\bColor\.(red|blue|green|black|white|gray|grey|orange|yellow|pink|purple|brown|cyan|mint|teal|indigo)\b|\bUIColor\s*\(|#colorLiteral)'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Colours come from AteColor / AtePalette / AteKitColor; add a token rather than a literal."
    severity: error
  kit_no_font_literal:
    name: "No font literal in the kit"
    included: "/App/DesignSystem/Kit/.*\\.swift$"
    regex: '(\.font\s*\(|\bFont\.(system|custom)\b|\bUIFont\s*\()'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Type comes from an AteTextStyle through .ateText(_:); AteType is the only file that names a font."
    severity: error
  kit_no_radius_literal:
    name: "No radius literal in the kit"
    included: "/App/DesignSystem/Kit/.*\\.swift$"
    regex: '\b(cornerRadius|cornerRadii|topLeadingRadius|topTrailingRadius|bottomLeadingRadius|bottomTrailingRadius)\s*:\s*[0-9]'
    excluded_match_kinds: [comment, doccomment, string]
    message: "Radii come from AteMetrics or the component's own metrics enum, never a number at the call."
    severity: error
  kit_no_shadow_literal:
    name: "No shadow in the kit"
    included: "/App/DesignSystem/Kit/.*\\.swift$"
    regex: '\.shadow\s*\('
    excluded_match_kinds: [comment, doccomment, string]
    message: "Shadows come from AteShadow / ateContactLine; glass casts its own."
    severity: error
