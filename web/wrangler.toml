# Ate's web pages for shared links (web/src/index.ts). Deployed by .github/workflows/web.yml, which adds
# the custom-domain route from Config/domain.txt — nothing to edit here when the domain lands.
name = "ate-web"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

rules = [
  { type = "Text", globs = ["**/*.svg"], fallthrough = true },
  { type = "Data", globs = ["**/*.woff2", "**/*.ttf"], fallthrough = true },
]

