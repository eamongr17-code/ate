name: TEMPORARY flaky-nightly diagnosis
# Loops ListsUITests on the unchanged code and on the fix, side by side. Removed before merge.
on:
  push:
    branches: [claude/project-thread-m8hr0h]
permissions:
  contents: read
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        sha: [61792a60d415a97c1216f3d85fee164bc793841e, 862132c71bde5e1573cb62999a2832b4b33fc5ab]
    name: Lists loop (${{ matrix.sha }})
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
      - run: sudo xcode-select -s /Applications/Xcode_26.5.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
      - id: sim
        run: |
          udid=$(xcrun simctl create ci-sim "iPhone 17 Pro")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          mkdir -p ci-out
      - env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: scripts/ci-sim.sh
