# Prod — the one way the production database and edge functions change (AGENTS.md rule 5).
#
# Run by hand: Actions → Prod → Run workflow, on the integration branch (or main; nothing else runs). It always prints what it would
# apply first (a dry run). Tick "apply" to then apply the pending migrations and deploy every edge
# function to prod (project vyaexmnajnbryimbkgkf). Migrations are forward-only; nothing here deletes
# data, and a migration that would is a CEO escalation before it is ever merged (rule 4d).
#
# Repository secrets it needs (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN       a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROD_DB_PASSWORD   prod's database password (Database → Settings)
# The functions' own secrets (ANTHROPIC_API_KEY, GOOGLE_PLACES_API_KEY) live in the prod project itself
# (Edge Functions → Secrets). The APNs key (APNS_KEY_ID, APNS_PRIVATE_KEY) and RESEND_API_KEY are
# GitHub secrets that every apply copies into prod ("Function secrets", "Email sign-in").

name: Prod

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the migrations and deploy the functions (unticked: dry run only)"
        type: boolean
        default: false
      reset:
        description: "ERASE prod and rebuild it from our migrations (backs it up first). Needs the box below."
        type: boolean
        default: false
      confirm_reset:
        description: "To reset, type ERASE PROD"
        type: string
        default: ""
      duplicate_dishes:
        description: "Duplicate dishes: scan lists them (changes nothing); scan-merge-names also merges same-name pairs; merge or reject the numbers below"
        type: choice
        options: [leave, scan, scan-merge-names, merge, reject]
        default: leave
      dish_numbers:
        description: "Proposal numbers to merge or reject, e.g. 3,5,8 (merge also takes: all)"
        type: string
        default: ""

concurrency:
  group: prod
  cancel-in-progress: false

env:
  PROD_REF: vyaexmnajnbryimbkgkf

# Read-only token: no job here writes to the repo (security sweep, Oct 2026).
permissions:
  contents: read

jobs:
  prod:
    name: Prod database + functions
    # Only what has been merged reaches prod: the integration branch or main, never a feature branch.
    if: github.ref == 'refs/heads/claude/project-thread-2f9ty8' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets present
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_PROD_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3, pinned: this job holds the prod/staging DB password
        with:
          version: latest

      - name: Link prod
        run: supabase link --project-ref "$PROD_REF" --password "$SUPABASE_DB_PASSWORD"

      # Read-only: which tables prod holds and roughly how many rows, so nothing is erased blind.
      - name: What prod holds now
        run: |
          {
            echo "### Prod: tables and row estimates"
            echo '```'
            supabase inspect db table-stats --linked 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Eamon, 2026-10-11: prod held the old Expo build's database; back it up, then rebuild from ours.
      - name: Back up prod before a reset
        if: inputs.reset && inputs.confirm_reset == 'ERASE PROD'
        run: |
          mkdir -p backup
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f backup/schema.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only -f backup/data.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --role-only -f backup/roles.sql
          # The repo is public, so its run artifacts are downloadable by anyone signed in to GitHub:
          # the dump leaves the runner only encrypted, under the prod DB password.
          # Decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in prod-backup.tar.gz.enc -pass pass:<prod DB password> | tar xz
          tar czf - backup | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SUPABASE_DB_PASSWORD -out prod-backup.tar.gz.enc
          rm -rf backup
          ls -la prod-backup.tar.gz.enc

      - uses: actions/upload-artifact@v4
        if: inputs.reset && inputs.confirm_reset == 'ERASE PROD'
        with:
          name: prod-backup-before-reset
          path: prod-backup.tar.gz.enc
          retention-days: 90
          if-no-files-found: error

      # Erases prod's database objects and data, then applies supabase/migrations from scratch.
      - name: Reset prod (erase and rebuild)
        if: inputs.reset && inputs.confirm_reset == 'ERASE PROD'
        run: supabase db reset --linked --no-seed --yes

      - name: What would change (dry run)
        run: |
          set -o pipefail
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee migration-list.txt
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" | tee dry-run.txt
          {
            echo "### Prod: pending migrations"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        if: inputs.apply || (inputs.reset && inputs.confirm_reset == 'ERASE PROD')
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy edge functions
        if: inputs.apply || (inputs.reset && inputs.confirm_reset == 'ERASE PROD')
        # Every function under supabase/functions, one at a time, each retried on a bundler timeout.
        run: .github/scripts/deploy_functions.sh "$PROD_REF"

      - name: Smoke read
        if: inputs.apply || (inputs.reset && inputs.confirm_reset == 'ERASE PROD')
        env:
          PROD_KEY: sb_publishable_EQqUPHQv-1yZrqqvOWphkw_IlFI2ALY
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' \
            "https://$PROD_REF.supabase.co/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: $PROD_KEY")
          echo "restaurants read: HTTP $code"
          [ "$code" = "200" ] || { cat body.json; exit 1; }
          echo "PROD APPLIED AND READABLE" >> "$GITHUB_STEP_SUMMARY"

      # Function secrets Eamon keeps in GitHub (the APNs key) → prod's Edge Function secrets.
      - name: Function secrets
        if: inputs.apply || (inputs.reset && inputs.confirm_reset == 'ERASE PROD')
        continue-on-error: true
        env:
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: .github/scripts/function_secrets.sh "$PROD_REF"

      # Email sign-in: the sender (Resend), code-only emails, Confirm email on. Skips until the domain
      # and RESEND_API_KEY exist.
      - name: Email sign-in
        if: inputs.apply || (inputs.reset && inputs.confirm_reset == 'ERASE PROD')
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: .github/scripts/auth_setup.sh "$PROD_REF" "$(tr -d '[:space:]' < Config/domain.txt)"

      # Push notifications (0059): on once prod holds the APNs key (APNS_* in Edge Functions → Secrets).
      # Idempotent; the summary says what is missing. A failure here never fails the apply.
      - name: Push notifications
        if: inputs.apply || (inputs.reset && inputs.confirm_reset == 'ERASE PROD')
        continue-on-error: true
        run: .github/scripts/push_setup.sh "$PROD_REF"

      # Chain restaurants (0085): every apply links the chains among the places we hold (websites checked
      # once per place, only for repeated names). A failure here never fails the apply.
      - name: Chain restaurants
        if: inputs.apply || (inputs.reset && inputs.confirm_reset == 'ERASE PROD')
        continue-on-error: true
        run: .github/scripts/dish_dedup.sh "$PROD_REF" chains

      # Same dish, different names (0071). After the deploy, so the function and its tables exist.
      - name: Duplicate dishes
        if: ${{ inputs.duplicate_dishes && inputs.duplicate_dishes != 'leave' }}
        # inputs reach the shell as env, quoted, never pasted into the script (audit 26 Oct, finding 20)
        env:
          DUPLICATE_DISHES: ${{ inputs.duplicate_dishes }}
          DISH_NUMBERS: ${{ inputs.dish_numbers }}
        run: .github/scripts/dish_dedup.sh "$PROD_REF" "$DUPLICATE_DISHES" "$DISH_NUMBERS"
