name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The snapshot recorder dispatches CI on the commit it pushed: a GITHUB_TOKEN push starts no
  # pull_request run, and this way nobody has to push a follow-up commit to get the PR checked.
  workflow_dispatch:

# PRs cancel a superseded run; main never does, so every merge finishes and saves its cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Read-only token: no job here writes to the repo (security sweep, Oct 2026).
permissions:
  contents: read

jobs:
  # Which surfaces a PR touches. A job gated off by it is SKIPPED, and a skipped required check counts
  # as passing. Pushes to main always run everything.
  #   backend — the schema/functions, the Swift that talks to them, and CI itself
  #   app     — anything the app build, the AteKit tests or the lint gate reads
  changes:
    name: Changed surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A dispatched run (the recorder's) diffs against the integration branch, as its PR would.
          base="${{ github.base_ref || 'claude/project-thread-2f9ty8' }}"
          files=$(git diff --name-only "origin/$base...HEAD")
          echo "$files"
          match() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "backend=$(match '^(supabase/|cloudflare/|\.github/scripts/photos_setup\.sh|AteKit/Sources/|AteKit/Tests/AteKitTests/.*(Contract|Staging)|AteKit/Package|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "app=$(match '^(App/|ShareExtension/|AteKit/|AteTests/|AteUITests/|Ate\.xcodeproj/|Config/|\.swiftlint\.yml|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    name: AteKit tests + app build
    needs: changes
    # The app only: AteKit's tests and the staging smoke run in the Linux job, so a backend-only PR
    # never waits on (or pays for) a Mac. A skipped required check counts as passing.
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    # 40, not 30: a slow runner on 28 Oct spent 22 minutes on the build alone and was cut off
    # eight minutes into the snapshots, with nothing failing.
    timeout-minutes: 40
    env:
      # Resolved packages live outside the checkout, so one cache entry also covers xcodebuild's clones.
      SPM_CLONES: /Users/runner/ate-spm
    steps:
      - uses: actions/checkout@v4
        with:
          # Two deep, so a PR's merge commit still has the PR head (HEAD^2) to read the message of.
          fetch-depth: 2

      # A [record-snapshots] commit's pictures are stale by design: snapshots.yml re-records them,
      # pushes, and dispatches CI on that commit. This run skips the 13 simulator minutes and fails
      # at the end, so the stale head can never read as green.
      - name: Recording run?
        id: rec
        run: |
          # Pull requests only: the recorder's dispatched run (and main) always compares.
          msg=""
          [ "${{ github.event_name }}" = "pull_request" ] && msg=$(git log -1 --format=%B HEAD^2)
          if echo "$msg" | grep -qF '[record-snapshots]'; then echo "record=true" >> "$GITHUB_OUTPUT"; else echo "record=false" >> "$GITHUB_OUTPUT"; fi

      # First, and inside this job: lint is a required gate without costing a runner of its own.
      - name: SwiftLint (strict)
        run: brew install swiftlint && swiftlint lint --strict --reporter github-actions-logging

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.5.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Write Secrets.xcconfig
        # The example carries the real publishable keys (safe by design: RLS is the boundary).
        run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig

      # Package clones only, keyed per commit so main's cache moves forward with every merge (a key on
      # the lockfile alone is written once and never updated). PRs restore the newest entry for the same
      # lockfile and never save; only a push to main saves (after the builds). AteKit/.build is NOT
      # cached: measured on #97 it was 1.9 GB and saved nothing (a fresh checkout's mtimes rebuild it).
      - name: Restore SPM cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.SPM_CLONES }}
          key: spm-${{ runner.os }}-${{ hashFiles('AteKit/Package.resolved', 'Ate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('AteKit/Package.resolved', 'Ate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            spm-${{ runner.os }}-

      # AteKit's own tests run in the Linux job; their Apple-only paths (ImageIO, NSDataDetector) run
      # here in AteTests (AteKitOnAppleTests), in the snapshot step below.

      # arm64 only: the runner is Apple silicon, and a generic simulator destination otherwise builds
      # x86_64 as well (every target twice).
      - name: Build app (Debug, simulator)
        if: needs.changes.outputs.app == 'true'
        run: |
          set -o pipefail
          # build-for-testing: the app plus its test bundles, once; the snapshots then run without
          # building again.
          xcodebuild -project Ate.xcodeproj -scheme Ate \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$SPM_CLONES" \
            -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build-for-testing > build.log 2>&1 || { grep -E "(error|fatal error):" build.log | sort -u | head -40; tail -50 build.log; exit 1; }
          tail -2 build.log

      # The visual contract: AteTests draws every page of the component gallery and the main screens
      # (on the preview data), light and dark, and compares them with the approved pictures in
      # AteTests/__Snapshots__. A frost band, a tint, a line height or a missing row fails here, before
      # a build. Re-record on purpose with a [record-snapshots] commit (snapshots.yml); this step never
      # records. On failure the result bundle (with the diff images
      # as attachments) is uploaded below.
      # Booted here, not behind the build: on a 3-core runner a background boot slowed lint, tests
      # and the build by more than it saved (measured on #371). Reduce Motion written before the
      # first boot did not take, so it is still boot, write, reboot.
      - name: Boot simulator for snapshots
        id: snapsim
        if: needs.changes.outputs.app == 'true' && steps.rec.outputs.record != 'true'
        run: |
          udid=$(xcrun simctl create snap-sim "iPhone 17 Pro")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          # Reduce Motion stills every clock in the kit (receipt breath, page loader, posting dots),
          # so the pictures are the same from one run to the next. The preference is read at boot,
          # so the simulator is booted once to take it and again to honour it.
          xcrun simctl spawn "$udid" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Kit and screen snapshots (light + dark)
        if: steps.snapsim.outputs.udid != ''
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Ate.xcodeproj -scheme Ate \
            -destination "id=${{ steps.snapsim.outputs.udid }}" \
            -only-testing:AteTests \
            -clonedSourcePackagesDirPath "$SPM_CLONES" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -resultBundlePath snapshots.xcresult > snapshots.log 2>&1 || {
              grep -E "error:|Test Case .*failed|\*\* TEST" snapshots.log | sort -u | head -40
              grep "SNAPSHOT_B64" snapshots.log || true
              echo "::error title=Snapshot pictures changed::A gallery page or main screen no longer matches AteTests/__Snapshots__. Open the snapshots.xcresult artifact for the diff. If the change is intended, push a commit whose message contains [record-snapshots]."
              exit 1
            }
          grep -E "Test Case .*passed|\*\* TEST" snapshots.log | tail -6

      - name: Upload snapshot result bundle
        if: failure() && steps.snapsim.outputs.udid != ''
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            snapshots.log
            snapshots.xcresult

      # Beta is the config the TestFlight lane archives, and it is NOT a DEBUG build — a #Preview
      # referencing a #if DEBUG helper compiles fine above but breaks the release lane. Unsigned
      # compile only; signing/upload stay in beta.yml. On main only: a PR that breaks it is caught
      # at merge, before any Beta is cut (betas are manual, one per feedback round).
      - name: Build app (Beta, unsigned)
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          xcodebuild -project Ate.xcodeproj -scheme Ate \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CLONES" \
            -configuration Beta CODE_SIGNING_ALLOWED=NO build > beta-build.log 2>&1 || { tail -50 beta-build.log; exit 1; }
          tail -2 beta-build.log

      # Saved once the builds pass, before the staging smoke: a staging hiccup must not cost main its cache.
      - name: Save SPM cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.SPM_CLONES }}
          key: spm-${{ runner.os }}-${{ hashFiles('AteKit/Package.resolved', 'Ate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}

      - name: Pictures are being re-recorded
        if: steps.rec.outputs.record == 'true' && needs.changes.outputs.app == 'true'
        run: |
          # The tag anywhere in the message counts (snapshots.yml reads it the same way), so a commit
          # that only describes recording must not spell the tag out.
          echo "::error title=Re-recording snapshots::This commit's message carries the record tag, so its pictures are being re-recorded. Record snapshots pushes them and runs CI on that commit; that run is the one that counts."
          exit 1

  # AteKit's tests on Linux, in Swift's own container: the same 1,282 tests as the Mac job, in a
  # couple of minutes on a cheap runner, so a logic break goes red long before the Mac job finishes.
  # The few Apple-only pieces (ImageIO thumbnails, the keychain session) are fenced off with
  # canImport and still run on the Mac. Threads run the same thing with scripts/test-linux.sh.
  linux:
    name: AteKit tests (Linux)
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      # Dependencies' build products only change with the lockfile; AteKit's own files rebuild anyway.
      - uses: actions/cache@v4
        with:
          path: AteKit/.build
          key: atekit-linux-${{ hashFiles('AteKit/Package.resolved') }}
      - name: swift test (Linux)
        run: swift test --package-path AteKit

      # The live half of the contract: one read-only decode per surface the app calls, as ci@ate.test.
      # Behaviour is pinned by the PGlite job; this only proves the deployed server still answers the
      # app's requests with rows its decoders accept. Backend PRs and main only; last, so a staging
      # outage never hides a build break.
      - name: Staging smoke (contract)
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
        run: ATE_CONTRACT_TESTS=1 swift test --package-path AteKit --skip-build --filter ContractSmoke

      - name: Staging RLS gate holds
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
        run: |
          # Swift's image has no curl.
          command -v curl >/dev/null || { apt-get update -qq && apt-get install -y -qq curl > /dev/null; }
          # Anon read with the publishable key must return 200 and an empty array (RLS deny-by-default).
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
            "${{ vars.SUPABASE_URL_STAGING }}/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_KEY_STAGING }}")
          echo "status=$code body=$(cat /tmp/body)"
          [ "$code" = "200" ] && [ "$(cat /tmp/body)" = "[]" ]

  backend:
    name: Backend tests (PGlite + sorter)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/tests/db/package-lock.json

      # Every migration applied in order to an in-process Postgres (PGlite/WASM + postgis), then the
      # SQL-level behaviour suites: RLS, keysets, aggregates, filters, browse, saves, blocks, account.
      # No Docker, never staging: a migration that cannot apply fails here, before anyone applies it.
      - name: Migration chain + SQL behaviour (PGlite)
        working-directory: supabase/tests/db
        run: npm ci --no-fund --no-audit && node --test

      # The function is Deno at deploy time, but its tested modules use no runtime APIs, so the same
      # suite runs under Node's type stripping (harness.ts bridges the two test runners).
      - name: Sorter suites (sort-entry)
        run: node --test supabase/functions/sort-entry/*_test.ts

      # send-push's logic (push.ts) is runtime-free too: fake APNs + fake database, under Node.
      - name: Push sender suites (send-push)
        run: node --test supabase/functions/send-push/*_test.ts

      # read-share's modules are runtime-free too (fetch/model/places are injected), so Node runs them.
      - name: Share reader suites (read-share)
        run: node --test supabase/functions/read-share/*_test.ts

      # apple-token's pure module (client secret, code exchange, revoke) under Node.
      - name: Apple token suites (apple-token)
        run: node --test supabase/functions/apple-token/*_test.ts

      # delete-account's storage purge (only the account's own folders, all of them) under Node.
      - name: Account deletion suites (delete-account)
        run: node --test supabase/functions/delete-account/*_test.ts

      # dish-dedup's scan (proposals for dishes that already exist) under Node, like match-photos.
      - name: Duplicate dish scan suites (dish-dedup)
        run: node --test supabase/functions/dish-dedup/*_test.ts

      # match-photos' pure module (plan, request, answer gate) under Node, like read-share.
      - name: Photo matcher suites (match-photos)
        run: node --test supabase/functions/match-photos/*_test.ts

      # The photos Worker (cloudflare/photos): its rules under Node, then a type check and a dry-run
      # bundle of the Worker itself, so a deploy never meets code that does not compile.
      - name: Photos Worker (R2)
        working-directory: cloudflare/photos
        run: |
          node --test src/*_test.ts
          npm ci --no-fund --no-audit
          npx -y -p typescript@5.9 tsc -p .
          printf 'name = "ate-photos-ci"\nmain = "src/index.ts"\ncompatibility_date = "2026-10-01"\n[[r2_buckets]]\nbinding = "PHOTOS"\nbucket_name = "ate-photos-ci"\n' > wrangler.generated.toml
          npx wrangler deploy --dry-run -c wrangler.generated.toml --outdir /tmp/photos-worker

      # places-search's pure modules, same deal: no runtime APIs, so Node runs them. Only the
      # node-compatible suites are listed — blend_test.ts imports
      # deno.land/std and need `deno test`.
      - name: Places locality derivation (the restaurants.city suburb rule)
        run: node --test supabase/functions/places-search/locality_test.ts

      - name: Places name cleaning (keywords padded onto a listing's name)
        run: node --test supabase/functions/places-search/name_test.ts

      - name: Places chain detection (one chain = name + website host)
        run: node --test supabase/functions/places-search/chains_test.ts

      - name: Feedback sync (reports into the private feedback repo)
        run: python3 .github/scripts/feedback_sync_test.py

      - name: TestFlight build notes (which PR text becomes a tester line)
        run: python3 .github/scripts/build_notes_test.py
