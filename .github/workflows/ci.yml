name: CI

on:
  pull_request:
  push:
    branches: [main]

# PRs cancel a superseded run; main never does, so every merge finishes and saves its cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which surfaces a PR touches. A job gated off by it is SKIPPED, and a skipped required check counts
  # as passing. Pushes to main always run everything.
  #   backend — the schema/functions, the Swift that talks to them, and CI itself
  #   app     — anything the app build, the AteKit tests or the lint gate reads
  changes:
    name: Changed surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          match() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "backend=$(match '^(supabase/|AteKit/Sources/|AteKit/Tests/AteKitTests/.*(Contract|Staging)|AteKit/Package|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "app=$(match '^(App/|AteKit/|AteUITests/|Ate\.xcodeproj/|Config/|\.swiftlint\.yml|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    name: AteKit tests + app build
    needs: changes
    # Backend-only PRs run it too, for the staging smoke (which needs the AteKit test build); they
    # skip the app builds below.
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Resolved packages live outside the checkout, so one cache entry also covers xcodebuild's clones.
      SPM_CLONES: /Users/runner/ate-spm
    steps:
      - uses: actions/checkout@v4

      # First, and inside this job: lint is a required gate without costing a runner of its own.
      - name: SwiftLint (strict)
        run: brew install swiftlint && swiftlint lint --strict --reporter github-actions-logging

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.5.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Write Secrets.xcconfig
        # The example carries the real staging values (publishable by design); prod stays placeholder in CI.
        run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig

      # Package clones only, keyed per commit so main's cache moves forward with every merge (a key on
      # the lockfile alone is written once and never updated). PRs restore the newest entry for the same
      # lockfile and never save; only a push to main saves (after the builds). AteKit/.build is NOT
      # cached: measured on #97 it was 1.9 GB and saved nothing (a fresh checkout's mtimes rebuild it).
      - name: Restore SPM cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.SPM_CLONES }}
          key: spm-${{ runner.os }}-${{ hashFiles('AteKit/Package.resolved', 'Ate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ hashFiles('AteKit/Package.resolved', 'Ate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            spm-${{ runner.os }}-

      - name: AteKit unit tests
        run: swift test --package-path AteKit

      # arm64 only: the runner is Apple silicon, and a generic simulator destination otherwise builds
      # x86_64 as well (every target twice).
      - name: Build app (Debug, simulator)
        if: needs.changes.outputs.app == 'true'
        run: |
          set -o pipefail
          xcodebuild -project Ate.xcodeproj -scheme Ate \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$SPM_CLONES" \
            -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > build.log 2>&1 || { tail -50 build.log; exit 1; }
          tail -2 build.log

      # Beta is the config the TestFlight lane archives, and it is NOT a DEBUG build — a #Preview
      # referencing a #if DEBUG helper compiles fine above but breaks the release lane. Unsigned
      # compile only; signing/upload stay in beta.yml. On main only: a PR that breaks it is caught
      # at merge, before any Beta is cut (betas are manual, one per feedback round).
      - name: Build app (Beta, unsigned)
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          xcodebuild -project Ate.xcodeproj -scheme Ate \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CLONES" \
            -configuration Beta CODE_SIGNING_ALLOWED=NO build > beta-build.log 2>&1 || { tail -50 beta-build.log; exit 1; }
          tail -2 beta-build.log

      # Saved once the builds pass, before the staging smoke: a staging hiccup must not cost main its cache.
      - name: Save SPM cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.SPM_CLONES }}
          key: spm-${{ runner.os }}-${{ hashFiles('AteKit/Package.resolved', 'Ate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}

      # The live half of the contract: one read-only decode per surface the app calls, as ci@ate.test.
      # Behaviour is pinned by the PGlite job; this only proves the deployed server still answers the
      # app's requests with rows its decoders accept. Backend PRs and main only; last, so a staging
      # outage never hides a build break.
      - name: Staging smoke (contract)
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
        run: ATE_CONTRACT_TESTS=1 swift test --package-path AteKit --skip-build --filter ContractSmoke

      - name: Staging RLS gate holds
        if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
        run: |
          # Anon read with the publishable key must return 200 and an empty array (RLS deny-by-default).
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
            "${{ vars.SUPABASE_URL_STAGING }}/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_KEY_STAGING }}")
          echo "status=$code body=$(cat /tmp/body)"
          [ "$code" = "200" ] && [ "$(cat /tmp/body)" = "[]" ]

  backend:
    name: Backend tests (PGlite + sorter)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/tests/db/package-lock.json

      # Every migration applied in order to an in-process Postgres (PGlite/WASM + postgis), then the
      # SQL-level behaviour suites: RLS, keysets, aggregates, filters, browse, saves, blocks, account.
      # No Docker, never staging: a migration that cannot apply fails here, before anyone applies it.
      - name: Migration chain + SQL behaviour (PGlite)
        working-directory: supabase/tests/db
        run: npm ci --no-fund --no-audit && node --test

      # The function is Deno at deploy time, but its tested modules use no runtime APIs, so the same
      # suite runs under Node's type stripping (harness.ts bridges the two test runners).
      - name: Sorter suites (sort-entry)
        run: node --test supabase/functions/sort-entry/*_test.ts

      # send-push's logic (push.ts) is runtime-free too: fake APNs + fake database, under Node.
      - name: Push sender suites (send-push)
        run: node --test supabase/functions/send-push/*_test.ts

      # places-search's pure modules, same deal: no runtime APIs, so Node runs them. Only the
      # node-compatible suites are listed — blend_test.ts and vic_filter_test.ts import
      # deno.land/std and need `deno test`.
      - name: Places locality derivation (the restaurants.city suburb rule)
        run: node --test supabase/functions/places-search/locality_test.ts
