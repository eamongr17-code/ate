name: Feedback

# Schedules only fire from main, but the real job lives on the integration branch
# (claude/project-thread-2f9ty8), where it changes with the code. This copy on main only forwards:
# every hour, and on a manual run, it dispatches feedback.yml on that branch, so the database refs,
# secrets and script it uses are always the branch's own. Main never needs updating for it again.
# Do not merge this file into the integration branch: there, feedback.yml is the real job.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which database to read (staging: Debug builds' reports, labelled staging)"
        type: choice
        options: [prod, staging]
        default: prod

permissions:
  actions: write

env:
  BRANCH: claude/project-thread-2f9ty8

jobs:
  forward:
    name: Run the integration branch's feedback sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch feedback.yml on the integration branch
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.environment || 'prod' }}
        run: |
          gh workflow run feedback.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f environment="$ENVIRONMENT"
          echo "Dispatched feedback.yml on $BRANCH (environment: $ENVIRONMENT)."
