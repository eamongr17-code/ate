<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Your Ate sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#EFEAE2;">
  <!-- 2 Nov 2026 (Eamon, mockup 3). __DOMAIN__ is filled in by auth_setup.sh; {{ .Token }} by Supabase. -->
  <div style="display:none;max-height:0;overflow:hidden;">{{ .Token }} is your Ate code. It works for the next 10 minutes.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EFEAE2;">
    <tr>
      <td align="center" style="padding:40px 16px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="max-width:420px;width:100%;">
          <tr>
            <td align="center" style="padding-bottom:22px;">
              <img src="https://__DOMAIN__/logo.png" width="96" height="46" alt="ate." style="display:block;width:96px;height:46px;border:0;">
            </td>
          </tr>
          <tr>
            <td align="center" style="font:400 26px/1.15 'Young Serif',Georgia,'Times New Roman',serif;color:#24141F;padding-bottom:20px;">Your sign-in code</td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:20px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background:#FBF9F6;border:1px solid #DCD5CC;border-radius:10px;padding:12px 8px 12px 18px;font:700 32px/1 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#24141F;letter-spacing:10px;">{{ .Token }}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="font:400 15px/1.45 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#24141F;padding:0 12px 26px;">Enter it in Ate to sign in. It works for the next 10&nbsp;minutes.</td>
          </tr>
          <tr>
            <td align="center" style="border-top:1px solid #DCD5CC;padding-top:16px;font:400 12.5px/1.5 -apple-system,'Helvetica Neue',Arial,sans-serif;color:#5E5560;">Didn’t ask for this? Ignore this email and nothing changes.<br>Ate · __DOMAIN__</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
