name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: AteKit tests + app build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.5.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Write Secrets.xcconfig
        # The example carries the real staging values (publishable by design); prod stays placeholder in CI.
        run: cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            AteKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: AteKit unit tests
        run: swift test --package-path AteKit

      - name: Build app (Debug, simulator)
        run: |
          set -o pipefail
          xcodebuild -project Ate.xcodeproj -scheme Ate \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build > build.log 2>&1 || { tail -50 build.log; exit 1; }
          tail -2 build.log

  contract:
    name: Contract tests vs staging
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.5.app || sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            AteKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: AteKit staging contract suite
        run: ATE_CONTRACT_TESTS=1 swift test --package-path AteKit --filter StagingContract

      - name: Staging reachable + RLS gate holds
        run: |
          # Anon read with publishable key must return 200 and an empty array (RLS deny-by-default).
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            "${{ vars.SUPABASE_URL_STAGING }}/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_KEY_STAGING }}")
          echo "status=$code body=$(cat /tmp/body)"
          [ "$code" = "200" ] && [ "$(cat /tmp/body)" = "[]" ]
