body { margin:0; background:var(--page); color:var(--ink); font-family:var(--display); }
.wrap { padding:32px 16px 48px; display:grid; gap:24px; justify-items:center; }
h1 { font-size:22px; font-weight:800; margin:0; text-align:center; }
.toggle { font:500 12px var(--mono); color:var(--muted); background:none; border:1px solid var(--muted); border-radius:14px; padding:5px 12px; cursor:pointer }
.row { display:flex; flex-wrap:wrap; gap:28px; justify-content:center; }
figure { margin:0; display:grid; gap:10px; justify-items:center; }
figcaption { font-size:15px; font-weight:600; text-align:center; max-width:393px; }
figcaption small { display:block; font-family:var(--mono); font-size:12px; font-weight:400; color:var(--muted); margin-top:4px; }
.rec { color:var(--rec); }

.close { position:absolute; top:62px; left:16px; width:44px; height:44px; display:grid; place-items:center; color:#fff; }
.close svg { width:22px; height:22px }
/* Current: glass pill */
.pill { position:absolute; left:50%; bottom:44px; transform:translateX(-50%); height:44px; padding:0 16px; border-radius:22px; display:flex; align-items:center; gap:6px; color:#fff; font-size:16px; font-weight:600; white-space:nowrap;
  background:rgba(255,255,255,.22); backdrop-filter:blur(14px) saturate(1.4); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35); }
.pill svg { width:16px; height:16px } .chev { opacity:.7 }
/* Public caption (shipped, build 133) */
.scrim { position:absolute; left:0; right:0; bottom:0; height:170px; background:linear-gradient(to top, rgba(0,0,0,.7), transparent); }
.cap { position:absolute; left:20px; right:64px; bottom:44px; color:#fff; display:grid; gap:2px; }
.cap b { font-size:17px; font-weight:600; }
.cap span { font-size:13px; opacity:.75; font-weight:500; }
.cap.inline b { display:flex; align-items:center; gap:7px }
/* The edit button: a bare pencil, no glass, 44pt hit area */
.edit { position:absolute; right:10px; bottom:44px; width:44px; height:44px; display:grid; place-items:center; color:#fff; opacity:.6 }
.edit svg { width:17px; height:17px }
.pen { width:14px; height:14px; opacity:.6; flex:none }
.pressed { opacity:.35 }
/* Native menu */
.dim { position:absolute; inset:0; background:rgba(0,0,0,.25) }
.menu { position:absolute; right:12px; bottom:96px; width:250px; border-radius:14px; background:var(--menu); backdrop-filter:blur(30px) saturate(1.8); color:var(--menuInk); font-size:17px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.35) }
.menu div { display:flex; align-items:center; gap:10px; padding:11px 16px; border-top:.5px solid var(--menuLine) }
.menu div:first-child { border-top:0 }
.menu .tick { width:16px; font-weight:600 }
.menu .sep { border-top:8px solid var(--menuLine); padding:0; height:0 }
