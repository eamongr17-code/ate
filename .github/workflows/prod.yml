# Prod, run from main: forwards to the integration branch, where the real Prod workflow lives.
#
# Actions → Prod → Run workflow defaults to main. This copy only re-runs Prod on
# claude/project-thread-2f9ty8 with the same "apply" choice, so the default branch can never point
# at a stale database (main's old copy still named the retired Seoul project). The forwarded run
# shows up as a second Prod run in the list; that one does the work and prints the result.
# Its other options (photos, duplicate dishes, reset) stay on the integration branch on purpose.

name: Prod

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the migrations and deploy the functions (unticked: dry run only)"
        type: boolean
        default: false

permissions:
  actions: write

env:
  BRANCH: claude/project-thread-2f9ty8

jobs:
  forward:
    name: Run Prod on the integration branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPLY: ${{ inputs.apply }}
        run: |
          gh workflow run prod.yml --ref "$BRANCH" -f apply="$APPLY"
          echo "Prod dispatched on $BRANCH (apply=$APPLY). Open the newest Prod run for the result." >> "$GITHUB_STEP_SUMMARY"
