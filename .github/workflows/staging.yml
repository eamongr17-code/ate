# Staging — applies merged backend changes to staging automatically (AGENTS.md rule 5: migrations are CI-only).
#
# Runs on every push to the integration branch that touches supabase/ (that is, every merged PR that
# changes the backend), and by hand from Actions → Staging → Run workflow. It applies pending migrations
# and deploys every edge function to STAGING only (project cvoitgoaosofkougmarn). Prod is never touched
# here; prod changes go through prod.yml by hand.
#
# Repository secrets it needs (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN          a personal access token (already set for prod.yml)
#   SUPABASE_STAGING_DB_PASSWORD   staging's database password (Database → Settings)
# The functions' own secrets live in the staging project itself and are never read or written here.

name: Staging

on:
  push:
    branches: [claude/project-thread-2f9ty8]
    paths: ["supabase/**"]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

env:
  STAGING_REF: cvoitgoaosofkougmarn

jobs:
  staging:
    name: Staging database + functions
    if: github.ref == 'refs/heads/claude/project-thread-2f9ty8' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets present
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_STAGING_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging
        run: supabase link --project-ref "$STAGING_REF" --password "$SUPABASE_DB_PASSWORD"

      # Belt and braces: refuse to go on unless the link really points at staging.
      - name: Linked project is staging
        run: |
          linked=$(cat supabase/.temp/project-ref)
          echo "linked: $linked"
          [ "$linked" = "$STAGING_REF" ] || { echo "::error::Linked to $linked, not staging"; exit 1; }

      - name: Apply migrations
        run: |
          set -o pipefail
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD" | tee dry-run.txt
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
          {
            echo "### Staging: migrations applied"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy edge functions
        # Every function under supabase/functions, with config.toml's per-function settings.
        run: supabase functions deploy --project-ref "$STAGING_REF" --use-api

      - name: Smoke read
        env:
          STAGING_KEY: sb_publishable_sMRFIanM38nujCu5o16Jeg_CWnDriNg
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' \
            "https://$STAGING_REF.supabase.co/rest/v1/restaurants?select=id&limit=1" \
            -H "apikey: $STAGING_KEY")
          echo "restaurants read: HTTP $code"
          [ "$code" = "200" ] || { cat body.json; exit 1; }
          echo "STAGING APPLIED AND READABLE" >> "$GITHUB_STEP_SUMMARY"
