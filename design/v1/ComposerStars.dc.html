<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ate: Composer, slide to score, name and score on one scale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap">
<style>
body{margin:0;font-family:'Newsreader',Georgia,serif;color:#24141F;background:#EFEAE2}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}h1,h2,h3,p{margin:0;font-weight:inherit}
.screen{--ground:#EFEAE2;--surface:#EFEAE2;--fg:#24141F;--muted:#5E5560;--chip:#FFFFFF;--paper:#FFFFFF;--field:#E4DED4;--hair:rgba(36,20,31,.14);width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--ground);color:var(--fg);display:flex;flex-direction:column}
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.h{font-family:'Bricolage Grotesque','Helvetica Neue',Helvetica,sans-serif;font-weight:800;line-height:1;letter-spacing:-.035em}
.ui{font-family:'Bricolage Grotesque','Helvetica Neue',Helvetica,sans-serif;font-weight:600;font-size:15px;line-height:1.2;letter-spacing:-.01em}
.lab{font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:11px;line-height:1.35;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prose{font-size:17px;line-height:1.5;text-wrap:pretty}
.tok{display:inline-flex;align-items:center;gap:3px;padding:0 7px 0 5px;border-radius:999px;background:#F6D365;color:#24141F;font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:.78em;font-weight:500;font-style:normal;line-height:1.55;vertical-align:1px;white-space:nowrap}
.ptok{display:inline-flex;align-items:center;gap:3px;padding:0 8px 0 5px;border-radius:999px;background:var(--field);font-family:'Bricolage Grotesque','Helvetica Neue',Helvetica,sans-serif;font-size:.8em;font-weight:600;font-style:normal;line-height:1.5;vertical-align:1px;white-space:nowrap}
.ink{background:var(--fg);color:var(--ground)}.pill{border-radius:999px}
.hit{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kbd{height:300px;flex-shrink:0;background:repeating-linear-gradient(45deg,#E6E0D6 0 8px,#EFEAE2 8px 16px);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="screen" style="background:var(--chip)">

<div class="row" style="padding:60px 12px 4px;justify-content:space-between">
<a href="Main.dc.html" aria-label="Close" class="hit"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:block"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<a href="Summary.dc.html" class="ui ink pill" style="padding:0 18px;height:38px;display:flex;align-items:center">Done</a>
</div>

<div class="col" style="flex-grow:1;padding:8px 22px;gap:16px;position:relative">
<p class="prose" style="font-size:19px"><span class="ptok"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:block"><path d="M12 21s6.5-6 6.5-11a6.5 6.5 0 0 0-13 0c0 5 6.5 11 6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg>Tipo 00</span> with Jess for her birthday. The tagliatelle al ragù <span class="tok" style="box-shadow:0 0 0 2px #24141F"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="flex-shrink:0;display:block"><path d="M12 2.8l2.85 5.9 6.45.85-4.7 4.5 1.2 6.4L12 17.3l-5.8 3.15 1.2-6.4-4.7-4.5 6.45-.85z"></path></svg>{{scoreText}}</span> was unreal, properly rich, glossy, gone in four minutes. Tiramisu <span class="tok"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="flex-shrink:0;display:block"><path d="M12 2.8l2.85 5.9 6.45.85-4.7 4.5 1.2 6.4L12 17.3l-5.8 3.15 1.2-6.4-4.7-4.5 6.45-.85z"></path></svg>3.0</span> a bit flat after that.</p>
<div class="col" style="position:absolute;left:22px;right:22px;top:100px;padding:18px 18px 16px;gap:12px;background:var(--chip);border-radius:28px;box-shadow:0 0 0 1.5px #24141F,0 18px 40px -18px rgba(36,20,31,.45)">
<div class="row" style="justify-content:space-between;align-items:baseline;gap:14px"><span class="h" style="font-size:22px;letter-spacing:-.03em;line-height:1.05;min-width:0;overflow-wrap:anywhere">Tagliatelle al ragù</span><span class="h" style="font-size:28px;letter-spacing:-.02em;flex-shrink:0;font-variant-numeric:tabular-nums">{{scoreText}}</span></div>
<div style="position:relative;display:flex;justify-content:space-between;height:48px;align-items:center">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<span style="position:relative;width:44px;height:44px;display:block">
<span style="position:absolute;top:0;left:0;display:flex"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" style="flex-shrink:0;display:block" fill="none" stroke="#24141F" stroke-width="1.3" stroke-linejoin="round"><path d="M12 2.8l2.85 5.9 6.45.85-4.7 4.5 1.2 6.4L12 17.3l-5.8 3.15 1.2-6.4-4.7-4.5 6.45-.85z"></path></svg></span>
<span style="position:absolute;top:0;left:0;height:44px;width:{{s.w}};overflow:hidden;display:flex"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" style="flex-shrink:0;display:block" fill="#F6D365" stroke="#24141F" stroke-width="1.3" stroke-linejoin="round"><path d="M12 2.8l2.85 5.9 6.45.85-4.7 4.5 1.2 6.4L12 17.3l-5.8 3.15 1.2-6.4-4.7-4.5 6.45-.85z"></path></svg></span>
</span>
</sc-for>
<label style="position:absolute;inset:0;display:block"><span style="position:absolute;left:-9999px">Score for tagliatelle al ragù</span><input type="range" min="0.5" max="5" step="0.5" value="{{score}}" onChange="{{change}}" onInput="{{change}}" style="position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize"></label>
</div>
</div>
</div>
<div class="row" style="padding:8px 14px 8px 8px;gap:6px;justify-content:space-between"><div class="row" style="gap:0"><button aria-label="Camera" class="hit"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:block"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button><button aria-label="Photo library" class="hit"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:block"><rect x="3.5" y="5" width="17" height="14" rx="2"></rect><path d="M4 16l4.5-4.5 4 4 3-3L20 17"></path><circle cx="9" cy="9.5" r="1.3"></circle></svg></button><a href="ComposerVoice.dc.html" aria-label="Dictate" class="hit"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:block"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"></path></svg></a></div><div class="row" style="gap:6px"><a href="ComposerStars.dc.html" class="ui" style="height:40px;padding:0 13px 0 9px;gap:5px;border-radius:999px;display:flex;align-items:center;font-size:14px;background:#24141F;color:#F6D365"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="flex-shrink:0;display:block"><path d="M12 2.8l2.85 5.9 6.45.85-4.7 4.5 1.2 6.4L12 17.3l-5.8 3.15 1.2-6.4-4.7-4.5 6.45-.85z"></path></svg>Score</a><a href="PlaceSheet.dc.html" class="ui" style="height:40px;padding:0 13px 0 9px;gap:5px;border-radius:999px;display:flex;align-items:center;font-size:14px;background:var(--field)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;display:block"><path d="M12 21s6.5-6 6.5-11a6.5 6.5 0 0 0-13 0c0 5 6.5 11 6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg>Place</a></div></div>
<div class="kbd"><span class="lab">System keyboard</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const score = (this.state && this.state.score != null) ? this.state.score : 4.5;
const stars = [1, 2, 3, 4, 5].map((i) => ({ w: score >= i ? '44px' : (score >= i - 0.5 ? '22px' : '0px') }));
return { stars: stars, score: score, scoreText: score.toFixed(1), change: (e) => this.setState({ score: parseFloat(e.target.value) }) };
}
}
</script>
</body>
</html>
