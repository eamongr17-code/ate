<title>Place Maps Link</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Young+Serif&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a Now/New switch over five real-scale iPhones (393×852pt), the rule card above them */
:root{
  --page:#F4F1EC; --page-fg:#24141F; --page-mut:#6E6470; --page-line:#DDD6CC; --accent:#F0623F; --butter:#F6D365;
  --f-dish:"Young Serif",Georgia,serif; --f-ui:"DM Sans",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#151416;--page-fg:#EEEAE4;--page-mut:#9C94A0;--page-line:#2C2A2E;color-scheme:dark}}
:root[data-theme="dark"]{--page:#151416;--page-fg:#EEEAE4;--page-mut:#9C94A0;--page-line:#2C2A2E;color-scheme:dark}
body{background:var(--page);color:var(--page-fg);font-family:var(--f-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
section{display:flex;flex-direction:column;gap:14px}
h1{font:400 40px/1.02 var(--f-dish);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:400 26px/1.05 var(--f-dish);letter-spacing:-.02em;margin:0}
p.s{margin:0;color:var(--page-mut);font-size:15px;line-height:1.5;max-width:70ch}
p.s b{color:var(--page-fg);font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);padding-block:10px;display:flex;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--page-line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--page)}
.seg2{display:flex;gap:6px;align-items:center}
.seg2 > span{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--page-mut);margin-right:4px}
.seg2 button{font:600 14px/1 var(--f-ui);padding:9px 13px;border-radius:999px;border:1px solid var(--page-line);background:transparent;color:var(--page-fg);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--page-fg);color:var(--page);border-color:var(--page-fg)}
.seg2 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{border:1px solid var(--page-line);border-radius:18px;padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 28px}
.rule div{min-width:0}
.rule .k{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-mut);margin-bottom:6px}
.rule p{margin:0;font-size:15px;line-height:1.45}
.rule p span{color:var(--page-mut)}
.table{overflow-x:auto}
table{border-collapse:collapse;font-size:14px;min-width:520px;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--page-line)}
th{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--page-mut)}
td.n{font-variant-numeric:tabular-nums}

.phones{display:flex;flex-wrap:wrap;gap:24px 20px;justify-content:center}
.ph-wrap{display:flex;flex-direction:column;gap:10px;align-items:center;width:calc(415px*var(--z,1))}
.ph-wrap .cap{font:600 15px/1.2 var(--f-ui)}
.phone{zoom:var(--z,1);width:393px;height:852px;border-radius:55px;position:relative;overflow:hidden;flex:none;
  box-shadow:0 0 0 10px #1a1a1c,0 0 0 11px #3a3a3e,0 24px 60px rgba(0,0,0,.22);margin:11px;
  --ground:#EFEAE2;--slip:#fff;--fg:#24141F;--mut:#5E5560;--glass:rgba(255,255,255,.62);--glass-line:rgba(255,255,255,.9);
  --glass-shadow:0 2px 10px rgba(36,20,31,.10);--pill:#F6D365;--hair:rgba(36,20,31,.12);--ink:#24141F;--ink-fg:#fff;--field:#E4DED4}
body.dark .phone{--ground:#0C0C0D;--slip:#1C1C1E;--fg:#F5F4F1;--mut:#A5A4A8;--glass:rgba(44,44,48,.6);--glass-line:rgba(255,255,255,.14);
  --glass-shadow:0 2px 12px rgba(0,0,0,.4);--pill:#E6C65F;--hair:rgba(255,255,255,.12);--ink:#F5F4F1;--ink-fg:#0C0C0D;--field:#2C2C2E}
.screen{position:absolute;inset:0;background:var(--ground);color:var(--fg);font-family:var(--f-ui);overflow:hidden}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 46px;font:600 17px/1 -apple-system,system-ui,sans-serif;z-index:6}
.status i{width:58px;height:13px;background:linear-gradient(90deg,var(--fg) 0 62%,transparent 62% 70%,var(--fg) 70%);border-radius:3px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;z-index:7}
.body{position:absolute;inset:54px 0 0;overflow:hidden}
.hrow{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.g{height:44px;min-width:44px;border-radius:22px;background:var(--glass);box-shadow:inset 0 0 0 .7px var(--glass-line),var(--glass-shadow);display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
svg.i{width:22px;height:22px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin:0 7px}

/* the new header */
.ph{padding:8px 20px 0;display:flex;flex-direction:column;align-items:flex-start}
.ph .art{margin-bottom:18px}
.ph h3{font:400 34px/1.05 var(--f-dish);letter-spacing:-.02em;margin:0;text-wrap:balance}
.ph .line{display:flex;align-items:center;gap:6px;margin-top:8px;font:500 15px/1.3 var(--f-ui);color:var(--mut);flex-wrap:wrap}
.ph .line b{font-weight:600;color:var(--fg)}
.ph .line .chev{font-weight:600}
.ph .acts{display:flex;gap:10px;margin-top:16px;width:100%}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 11px/1 var(--f-ui);color:#24141F;background:#7EC4EA;flex:none}
.btn{flex:1;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font:600 16px/1 var(--f-ui);letter-spacing:-.01em}
.btn.ink{background:var(--ink);color:var(--ink-fg)}
.btn.soft{background:var(--field);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--slip);display:inline-flex;align-items:center;font:600 15px/1 var(--f-ui)}

/* now-only variants */
.now-list{display:flex;flex-direction:column;align-items:center;padding:0 20px}
.now-list h3{font:400 28px/1.05 var(--f-dish);letter-spacing:-.02em;margin:18px 0 0;text-align:center}

/* art */
.cover{width:160px;height:160px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.cover.big{width:224px;height:224px}
.pa{background:radial-gradient(circle at 50% 55%,#e9d6c0 0 28%,#26344a 29% 62%,#5a4535 63%)}
.pb{background:radial-gradient(circle at 40% 40%,#e9a46a,#a65a2a)}
.pc{background:radial-gradient(circle at 45% 45%,#f07a5a,#b8382a)}
.pd{background:radial-gradient(circle at 40% 40%,#c9d3b0,#8c9a6c)}
.pair{display:flex}
.pair span{width:120px;height:120px;border-radius:26px;box-shadow:0 0 0 3px var(--ground)}
.pair span:first-child{transform:rotate(-5deg)}
.pair span:last-child{transform:rotate(5deg);margin-left:-18px;margin-top:10px}
.avbig{width:72px;height:72px;border-radius:50%;background:#7EC4EA;display:flex;align-items:center;justify-content:center;font:700 32px/1 var(--f-ui);color:#24141F}

/* rows under */
.rows{margin:22px 12px 0;background:var(--slip);border-radius:22px;padding:4px 16px}
.r{display:flex;align-items:center;gap:12px;padding:11px 0}
.r + .r{border-top:1px solid var(--hair)}
.r .n{font:500 15px/1 var(--f-ui);color:var(--mut);width:14px}
.r .th{width:48px;height:48px;border-radius:14px;flex:none}
.r h4{flex:1;margin:0;font:400 18px/1.1 var(--f-dish);letter-spacing:-.01em;min-width:0}
.r h4 small{display:block;font:500 13px/1.3 var(--f-ui);color:var(--mut);letter-spacing:0;margin-top:3px}
.tok{background:var(--pill);color:#24141F;border-radius:999px;font:500 13px/1 var(--f-mono);padding:5px 8px;white-space:nowrap}
.sec{font:400 24px/1.02 var(--f-dish);letter-spacing:-.02em;padding:26px 20px 10px;margin:0}
.slip{background:var(--slip);margin:16px 12px 0;border-radius:22px;padding:16px 18px}
.slip .d{display:flex;justify-content:space-between;font:400 20px/1.05 var(--f-dish);padding:6px 0}
.slip .d b{font:700 22px/1 var(--f-ui);letter-spacing:-.02em}
.slip .w{font:400 16px/1.5 Georgia,serif;margin:8px 0 0;color:var(--fg)}
.tabs{position:absolute;left:16px;right:16px;bottom:24px;height:62px;display:flex;gap:10px;z-index:5}
.tabbar{flex:1;border-radius:31px;background:var(--glass);box-shadow:inset 0 0 0 .7px var(--glass-line),var(--glass-shadow)}
.plus{width:62px;border-radius:31px;background:var(--glass);box-shadow:inset 0 0 0 .7px var(--glass-line),var(--glass-shadow)}
.fade{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,var(--ground) 70%);z-index:4}

.chip svg{width:16px;height:16px;stroke:var(--fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-right:6px}
.chip .st{color:#E0A100;margin-right:4px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:8}
.sheet{position:absolute;left:10px;right:10px;bottom:34px;z-index:9;display:flex;flex-direction:column;gap:8px;font-family:-apple-system,system-ui,sans-serif}
.sheet .grp{background:var(--as);backdrop-filter:blur(20px);border-radius:14px;overflow:hidden}
.sheet .t{padding:14px 16px;text-align:center;font:400 13px/1.3 -apple-system,system-ui,sans-serif;color:var(--mut);border-bottom:.5px solid var(--hair)}
.sheet .o{height:57px;display:flex;align-items:center;justify-content:center;font:400 20px/1 -apple-system,system-ui,sans-serif;color:#0A84FF}
.sheet .o + .o{border-top:.5px solid var(--hair)}
.sheet .c{font-weight:600}
.phone{--as:rgba(242,242,247,.92)}
body.dark .phone{--as:rgba(44,44,46,.92)}
.note{font:500 14px/1.4 var(--f-ui);color:var(--page-mut);max-width:415px;text-align:center;margin:0}
.ring{box-shadow:0 0 0 2px #F0623F}
</style>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <h1>See a place on the map</h1>
    <p class="s">Two places for it on a restaurant's page. Either way, tapping opens <b>Apple Maps</b> on the place. If <b>Google Maps</b> is on the phone, iOS's own sheet asks which (third phone). Places added by hand with no map point open a Maps search for the name and address.</p>
    <div class="bar">
      <div class="seg2" id="modeCtl"><span>Mode</span><button data-m="light" aria-pressed="true">Light</button><button data-m="dark" aria-pressed="false">Dark</button></div>
    </div>
  </header>
  <section><div class="phones" id="phones"></div></section>
</div>
<script>
(function(){
  var I={back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    map:'<svg class="i" viewBox="0 0 24 24"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>',
    pin:'<svg viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>'};
  function row(n,name,place,cls,score){return '<div class="r"><span class="n">'+n+'</span><span class="th '+cls+'"></span><h4>'+name+'<small>'+place+'</small></h4><span class="tok">★ '+score+'</span></div>'}
  var menu='<div class="sec">The Top Ate</div><div class="rows" style="margin-top:0">'+row(1,'Caramelised Banana Iced Latte','2 people','pb','4.0')+row(2,'Fried Chicken Pancake','1 person','pc','4.0')+row(3,'Iced Matcha','1 person','pd','3.5')+'</div>';
  function frame(right,chips,extra){return '<div class="phone"><div class="screen"><div class="status"><span>9:03</span><i></i></div><div class="island"></div><div class="body">'+
    '<div class="hrow"><span class="g">'+I.back+'</span>'+right+'</div><div class="ph"><h3>Small Wins</h3><div class="chips">'+chips+'</div></div>'+menu+'</div><div class="fade"></div><div class="tabs"><div class="tabbar"></div><div class="plus"></div></div>'+(extra||'')+'</div></div>'}
  var facts='<span class="chip"><span class="st">★</span>3.6</span><span class="chip">2 people</span><span class="chip">Armadale</span>';
  var sheet='<div class="dim"></div><div class="sheet"><div class="grp"><div class="t">Small Wins</div><div class="o">Apple Maps</div><div class="o">Google Maps</div></div><div class="grp"><div class="o c">Cancel</div></div></div>';
  var P=[
    {cap:'A · Map button, top right',note:'Same round glass button as Save on a dish page. Chips unchanged.',html:frame('<span class="g ring">'+I.map+'</span>',facts)},
    {cap:'B · Street address chip',note:'A fourth chip: the pin and the street. Shows where it is before you tap. A place with no street on file shows the pin and "Map".',html:frame('',facts+'<span class="chip ring">'+I.pin+'1203 High St</span>')},
    {cap:'Google Maps installed',note:'iOS\'s own sheet, for A or B. Without Google Maps, the tap goes straight to Apple Maps.',html:frame('<span class="g">'+I.map+'</span>',facts,sheet)}
  ];
  document.getElementById('phones').innerHTML=P.map(function(p){return '<div class="ph-wrap"><span class="cap">'+p.cap+'</span>'+p.html+'<p class="note">'+p.note+'</p></div>'}).join('');
  function press(v){Array.prototype.forEach.call(document.querySelectorAll('#modeCtl button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.m===v))});document.body.classList.toggle('dark',v==='dark');document.documentElement.setAttribute('data-theme',v)}
  document.getElementById('modeCtl').addEventListener('click',function(e){var b=e.target.closest('button');if(b)press(b.dataset.m)});
  if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)press('dark');
  function fit(){var w=Math.min(document.documentElement.clientWidth-32,1320);document.documentElement.style.setProperty('--z',Math.min(1,w/415).toFixed(3))}
  fit();addEventListener('resize',fit);
})();
</script>
